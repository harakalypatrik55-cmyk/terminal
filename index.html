<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --neon-p: #ff00ff; --neon-b: #00f2ff; --bg-deep: #05010a; }
        body { background: var(--bg-deep); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 100px; overflow-x: hidden; }

        /* POZADIE A SKENER */
        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 30%, rgba(188, 19, 254, 0.15) 0%, transparent 40%), linear-gradient(180deg, #0a001a 0%, #1a0033 100%); z-index: -2; }
        .grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(188, 19, 254, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(188, 19, 254, 0.1) 1px, transparent 1px); background-size: 30px 30px; z-index: -1; }
        .scan-line { position: fixed; top: 0; left: 0; width: 100%; height: 8px; background: linear-gradient(to bottom, transparent, var(--neon-b), transparent); box-shadow: 0 0 20px var(--neon-b); z-index: 9999; pointer-events: none; animation: scanning 3s infinite ease-in-out; }
        @keyframes scanning { 0% { top: -5%; } 100% { top: 105%; } }

        .view { display: none; padding: 15px; }
        .view.active { display: block; }

        /* KARTY A STATISTIKY */
        .league-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 0, 255, 0.3); border-radius: 18px; margin-bottom: 15px; padding: 15px; backdrop-filter: blur(10px); }
        .match-box { background: rgba(255, 255, 255, 0.02); border-radius: 14px; padding: 15px; margin-top: 10px; display: flex; justify-content: space-between; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-box { background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 25px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); opacity: 0; animation: slideIn 0.4s forwards; }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .stat-val { font-size: 32px; font-weight: bold; display: block; }
        .c-green { color: #00ff00; } .c-blue { color: #00f2ff; } .c-pink { color: #ff00ff; } .c-yellow { color: #ffcc00; }

        /* NOVÝ BOX PRE GPT ANALÝZU */
        .gpt-analysis-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
            opacity: 0;
            animation: fadeIn 1s 0.8s forwards;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: rgba(10, 5, 20, 0.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(0, 242, 255, 0.2); backdrop-filter: blur(15px); }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div class="animated-bg"></div>
    <div class="grid"></div>

    <div id="v-list" class="view active">
        <h2 style="text-align:center; color:var(--neon-b);">AI TERMINAL</h2>
        <div id="match-list"></div>
    </div>

    <div id="v-detail" class="view">
        <div onclick="showList()" style="color:var(--neon-b); cursor:pointer; padding-bottom:10px;">← SPÄŤ</div>
        <div id="detail-content"></div>
    </div>

    <nav class="nav">
        <div style="text-align:center; color:var(--neon-b); font-size:10px;">🏟️<br>ZÁPASY</div>
        <div style="text-align:center; color:#555; font-size:10px;">🎫<br>TIKET</div>
        <div style="text-align:center; color:#555; font-size:10px;">💡<br>TIPY</div>
        <div style="text-align:center; color:#555; font-size:10px;">📊<br>ŠTATISTIKY</div>
    </nav>

    <script>
        const db = REPLACE_DB;
        const selectedDate = "REPLACE_DATE";

        function animateValue(id, start, end, duration) {
            let obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start) + "%";
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function showList() {
            document.getElementById('v-detail').classList.remove('active');
            document.getElementById('v-list').classList.add('active');
        }

        function openMatch(m) {
            document.getElementById('v-list').classList.remove('active');
            const det = document.getElementById('v-detail');
            det.classList.add('active');
            
            document.getElementById('detail-content').innerHTML = `
                <h2 style="color:#ff00ff; text-align:center;">${m.home} vs ${m.away}</h2>
                <div class="stat-grid">
                    <div class="stat-box" style="animation-delay:0.1s"><span id="p1" class="stat-val c-green">0%</span><small>OVER 1.5</small></div>
                    <div class="stat-box" style="animation-delay:0.2s"><span id="p2" class="stat-val c-blue">0%</span><small>OVER 2.5</small></div>
                    <div class="stat-box" style="animation-delay:0.3s"><span id="p3" class="stat-val c-pink">0%</span><small>BTTS</small></div>
                    <div class="stat-box" style="animation-delay:0.4s"><span id="p4" class="stat-val c-yellow">0%</span><small>ROHY 7.5</small></div>
                </div>
                <div class="stat-box" style="margin-top:15px; width:calc(100% - 22px); animation-delay:0.5s;">
                    <span id="p5" class="stat-val" style="color:#ff6600;">0%</span><small>KARTY 3.5</small>
                </div>

                <div class="gpt-analysis-box">
                    <b style="color:var(--neon-b)">AI ANALYTIK:</b><br>
                    <span id="gpt-text">Analyzujem dáta...</span>
                </div>
            `;

            // Animácia čísel
            setTimeout(() => {
                animateValue("p1", 0, parseInt(m.p_over15), 1000);
                animateValue("p2", 0, parseInt(m.p_over25), 1100);
                animateValue("p3", 0, parseInt(m.p_btts), 1200);
                animateValue("p4", 0, parseInt(m.p_corners), 1300);
                animateValue("p5", 0, parseInt(m.p_cards), 1400);
                
                // Vloženie textu analýzy (m.gpt)
                document.getElementById('gpt-text').innerText = m.gpt || "Dáta o chýbajúcich hráčoch nie sú momentálne dostupné, ale na základe formy očakávame útočný futbal.";
            }, 500);
        }

        function render() {
            const container = document.getElementById('match-list');
            if(!db[selectedDate]) return;
            for(const liga in db[selectedDate]) {
                let html = `<div class="league-card"><b>${liga}</b>`;
                db[selectedDate][liga].forEach(m => {
                    html += `<div class="match-box" onclick='openMatch(${JSON.stringify(m)})'>
                        <span>${m.home}<br>${m.away}</span>
                        <b style="color:var(--neon-p)">${m.score}</b>
                    </div>`;
                });
                container.innerHTML += html + `</div>`;
            }
        }
        render();
    </script>
</body>
</html>
